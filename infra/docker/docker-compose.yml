services:
  qstrata-eda:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: qstrata-eda
    ports:
      - "8888:8888"
    volumes:
      - ../..:/workspace
      - ${DATASET_PATH:-../../data}:/data
    environment:
      - JUPYTER_ENABLE_LAB=yes
    working_dir: /workspace
