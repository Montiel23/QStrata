experiment:
  phase: q34c_cv_nas_pilot
  trial_id: q34c_trial_002
  description: Q34C trial 2 n_modes=1 depth=1 sq_cap=0.5 lr=0.001 wd=0.0001
dataset:
  name: vindr_binary_roi_224
  split: canonical_42
  root: data/processed/vindr_binary_roi_224
model:
  architecture: cv_quantum_head
  backbone: c006_d040_frozen
  checkpoint_path: checkpoints/c006_d040_classical_anchor.pt
  n_modes: 1
  cv_depth: 1
  squeezing_cap: 0.5
  displacement_cap: 2.0
  compression_dim: 2
  encoding_strategy: displacement_encoding
  beam_splitter_topology: circular
  readout_strategy: first_moments
  covariance_parameterization: symplectic_parameterization
training:
  epochs: 2
  batch_size: 4
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping:
    enabled: false
reproducibility:
  seed: 43
command:
  executable: python3
  args:
  - scripts/train_q34c_cv_candidate.py
  - --config
  - configs/experiments/q34c_cv_nas/q34c_trial_002.yaml
