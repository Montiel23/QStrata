campaign_id: pure_quantum_readout_smoke
campaign_version: "1.0"
created_date: "2026-06-04"
created_by: Claude Code (Sonnet 4.6) — Q66P slice
project: qstrata
description: >
  Smoke campaign for the pure quantum readout study.
  Validates end-to-end execution of pure Born-rule and homodyne readout architectures
  on tiny data (64 train / 32 val / 32 test) with 1 epoch and 1 seed before
  launching the full benchmark campaign.
  Decision gate: Q74S must emit READY_FOR_FULL_PURE_QUANTUM_READOUT_CAMPAIGN
  before pure_quantum_readout_full unlocks.

scientific_context:
  parent_campaign: binary_classical_publication_package
  motivation: >
    Q64 confirmed that DV-QNN (Q57) and CV-QNN (Q58) are hybrid quantum-classical models
    where only 4.2% and 1.9% of trainable parameters are quantum. Final classification
    is performed by classical Linear layers, not quantum measurement outcomes.
    This campaign tests pure quantum readout variants to study the actual contribution
    of quantum circuits to classification.
  hybrid_baselines:
    Q57_DV_QNN_vindr_auroc: 0.8842
    Q58_CV_QNN_vindr_auroc: 0.9534
    Q56_CNN_vindr_auroc: 0.9731
  embedding_source: workspace/experiments/Q49/embeddings/
  checkpoint_source: workspace/experiments/Q62A/checkpoints/
  framework_constraint: "Custom in-house qcore only — no PennyLane, Qiskit, Strawberry Fields, TorchQuantum"

smoke_constraints:
  max_train_samples: 64
  max_val_samples: 32
  max_test_samples: 32
  seeds: [42]
  max_epochs: 1
  no_full_benchmark: true
  no_multiclass: true
  no_object_detection: true
  no_dataset_mutation: true
  runtime_target_per_slice_min: 30
  binary_classification_only: true
  vindr_first: true
  buu_disclosure_required_if_used: true

slices:
  - Q66
  - Q67S
  - Q68S
  - Q68DS
  - Q72S
  - Q74S

dependencies:
  Q66: []
  Q67S: [Q66]
  Q68S: [Q66]
  Q68DS: [Q66]
  Q72S: [Q67S, Q68S, Q68DS]
  Q74S: [Q72S]

slice_specs:
  Q66:
    name: Pure Quantum Visualization Package
    input_spec: workspace/projects/qstrata/inputs/q66_pure_quantum_visualization_package.md
    estimated_runtime: LOW
    type: visualization
    description: >
      Generate dataset, architecture, and quantum readout visualization figures.
      No training. Reads Q49 embeddings and existing qcore source only.

  Q67S:
    name: DV-QNN Pure Readout Smoke
    input_spec: workspace/projects/qstrata/inputs/q67s_dv_qnn_pure_readout_smoke.md
    estimated_runtime: LOW
    type: smoke_test
    description: >
      Smoke test of DV-QNN with three pure Born-rule readout variants (parity, top-k,
      expectation value). No classical Linear(16->2) after measurement.
      64 train / 32 val / 1 epoch / seed=42 / VinDr-SpineXR only.

  Q68S:
    name: CV-QNN Single Homodyne Readout Smoke
    input_spec: workspace/projects/qstrata/inputs/q68s_cv_qnn_homodyne_readout_smoke.md
    estimated_runtime: LOW
    type: smoke_test
    description: >
      Smoke test of CV-QNN with single homodyne threshold readout.
      No classical Linear(2->2) after measurement. 64/32/1 epoch/seed=42.

  Q68DS:
    name: CV-QNN Dual Homodyne Readout Smoke
    input_spec: workspace/projects/qstrata/inputs/q68ds_cv_qnn_dual_homodyne_readout_smoke.md
    estimated_runtime: LOW
    type: smoke_test
    description: >
      Smoke test of CV-QNN with dual homodyne centroid readout using (X_mode0, X_mode1).
      No classical Linear(2->2) after measurement. 64/32/1 epoch/seed=42.

  Q72S:
    name: Quantum Metrics Smoke
    input_spec: workspace/projects/qstrata/inputs/q72s_quantum_metrics_smoke.md
    estimated_runtime: LOW
    type: analysis
    description: >
      Compute available quantum metrics from smoke run outputs.
      No re-training. Reads Q67S/Q68S/Q68DS artifacts and Q62A checkpoints.

  Q74S:
    name: Hybrid vs Pure Smoke Comparison
    input_spec: workspace/projects/qstrata/inputs/q74s_hybrid_vs_pure_smoke_comparison.md
    estimated_runtime: LOW
    type: analysis
    gate: true
    gate_signal: READY_FOR_FULL_PURE_QUANTUM_READOUT_CAMPAIGN
    description: >
      Compare hybrid DV-QNN/CV-QNN baselines against pure readout smoke results.
      Emits READY_FOR_FULL_PURE_QUANTUM_READOUT_CAMPAIGN or NOT_READY_WITH_BLOCKERS.

execution_policy:
  run_benchmarks: false
  run_training: true
  run_inference: true
  push_to_remote: false
  commit: true
  first_ready_slice: Q66
  execution_order: [Q66, Q67S, Q68S, Q68DS, Q72S, Q74S]
  parallel_eligible: [Q67S, Q68S, Q68DS]

dependency_graph:
  Q66: []
  Q67S: [Q66]
  Q68S: [Q66]
  Q68DS: [Q66]
  Q72S: [Q67S, Q68S, Q68DS]
  Q74S: [Q72S]

validation_criteria:
  - pure_quantum_readout_smoke campaign ACTIVE
  - Q66 status READY; all others BLOCKED
  - Q66 has no blocked_by dependencies
  - Q67S/Q68S/Q68DS all blocked by Q66
  - Q72S blocked by Q67S AND Q68S AND Q68DS
  - Q74S blocked by Q72S
  - gate at Q74S emits READY or NOT_READY
  - smoke constraints enforced: max 64 train / 32 val / 1 epoch / 1 seed
  - no external quantum frameworks
  - no push

references:
  architecture_audit: workspace/experiments/Q64/quantum_architecture_metrics_audit.md
  redesign_plan: workspace/experiments/Q65/quantum_model_redesign_plan.md
  metrics_matrix: workspace/experiments/Q65/quantum_metrics_matrix.csv
  dv_qnn_hybrid_results: workspace/experiments/Q57/results/vindr_metrics.csv
  cv_qnn_hybrid_results: workspace/experiments/Q58/results/vindr_metrics.csv
  checkpoints: workspace/experiments/Q62A/checkpoints/
  embeddings: workspace/experiments/Q49/embeddings/
