<rect x="383" y="81" width="55" height="262" fill="#2166ac" opacity="0.85"/>
<text x="410" y="77" text-anchor="middle" font-size="8" fill="#333">1.0000</text>

<rect x="445" y="81" width="55" height="262" fill="#d6604d" opacity="0.85"/>
<text x="472" y="77" text-anchor="middle" font-size="8" fill="#333">1.0000</text>

<rect x="507" y="81" width="55" height="262" fill="#4dac26" opacity="0.85"/>
<text x="534" y="77" text-anchor="middle" font-size="8" fill="#333">1.0000</text>

