scientific_principles:
  - name: Classical Ceiling Principle
    rule: Classical NAS precedes quantum NAS. Frozen binary benchmarks define the floor.
  - name: No Quantum Advantage Claim
    rule: DV/CV residual advantages are scientifically interesting but not statistically validated.
  - name: Multi-Objective Optimization
    rule: No single-metric optimization. Pareto frontier across AUROC, F1, params, latency.
  - name: Binary Uplift Before Multiclass
    rule: Phase 6b + publication campaign must complete before Phase 7 begins.
  - name: Reproducibility-First
    rule: Every experiment reconstructable from frozen config and git commit SHA.
