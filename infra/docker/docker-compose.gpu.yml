services:
  qstrata-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8889:8888"
    volumes:
      - ../..:/workspace
      - /media/mike/Datasets/vindr-spinexr:/datasets/vindr-spinexr:ro
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --IdentityProvider.token=''
